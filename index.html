<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <title>מעקב התחייבויות - בית כנסת</title>
  <style>
    :root { --primary: #1a365d; --accent: #2b6cb0; --bg: #f7fafc; --card: #ffffff; --green: #2f855a; --red: #c53030; --amber: #b7791f; }
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { margin: 0; background: var(--bg); color: #1a202c; padding-bottom: 85px; }
    header {
      background: var(--primary);
      color: #fff;
      padding: calc(36px + env(safe-area-inset-top, 10px)) 16px 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.05rem;
      font-weight: bold;
      position: sticky;
      top: 0;
      z-index: 10;
      box-shadow: 0 2px 6px rgba(0,0,0,0.12);
    }
    .refresh-btn { background: rgba(255,255,255,0.2); color: #fff; border: none; border-radius: 8px; padding: 7px 12px; font-size: 0.85rem; cursor: pointer; }
    .container { max-width: 600px; margin: 0 auto; padding: 14px; }
    .card { background: var(--card); border-radius: 12px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 4px rgba(0,0,0,0.08); }
    label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 0.92rem; color: #2d3748; }
    input, select { width: 100%; padding: 12px; border: 1px solid #cbd5e0; border-radius: 8px; font-size: 1rem; margin-bottom: 12px; background: #fff; }
    .row-flex { display: flex; gap: 8px; align-items: center; }
    .row-flex input, .row-flex select { margin-bottom: 0; flex: 1; }
    button { border: none; border-radius: 8px; padding: 11px 14px; font-size: 0.95rem; font-weight: 600; cursor: pointer; }
    .btn-primary { background: var(--primary); color: #fff; width: 100%; }
    .btn-small { background: var(--accent); color: #fff; padding: 11px 14px; white-space: nowrap; }
    .btn-pay { background: #e6fffa; color: var(--green); border: 1px solid var(--green); padding: 7px 12px; font-size: 0.84rem; }
    .btn-partial { background: #fefcbf; color: var(--amber); border: 1px solid var(--amber); padding: 7px 12px; font-size: 0.84rem; }
    .nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; border-top: 1px solid #e2e8f0; display: flex; z-index: 20; padding-bottom: env(safe-area-inset-bottom, 0px); }
    .nav button { flex: 1; background: none; color: #4a5568; border-radius: 0; padding: 12px 4px; font-size: 0.9rem; }
    .nav button.active { color: var(--primary); border-top: 3px solid var(--primary); font-weight: bold; }
    .hidden { display: none; }
    .list-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #edf2f7; }
    .badge-debt { background: #fed7d7; color: var(--red); padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
    .badge-ok { background: #c6f6d5; color: var(--green); padding: 4px 10px; border-radius: 20px; font-weight: bold; font-size: 0.9rem; }
    .toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%); background: #2f855a; color: #fff; padding: 10px 20px; border-radius: 20px; font-weight: 600; z-index: 50; max-width: 90%; text-align: center; }
    .quick-amounts { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .quick-amounts button { background: #edf2f7; color: #2d3748; padding: 8px 12px; font-size: 0.9rem; flex: 1; }
    .sync-note { font-size: 0.78rem; color: #718096; text-align: center; margin-bottom: 10px; }
    .person-card { border: 1px solid #e2e8f0; border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #fff; }
    .person-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; gap: 8px; }
    .person-actions { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
    .person-details { margin-top: 10px; padding-top: 10px; border-top: 1px dashed #cbd5e0; background: #f8fafc; border-radius: 8px; padding: 10px; font-size: 0.86rem; }
    .expand-hint { font-size: 0.78rem; color: #718096; margin-top: 2px; }
  </style>
</head>
<body>
<header>
  <span>מעקב התחייבויות - בית כנסת</span>
  <button class="refresh-btn" onclick="syncFromSheet(true)">רענן סנכרון</button>
</header>
<div id="toast" class="toast hidden"></div>
<div id="loader" style="text-align:center; padding:60px 20px;">טוען נתונים...</div>

<div id="app" class="container hidden">
  <div id="syncStatus" class="sync-note"></div>

  <div id="tab-entry">
    <div class="card">
      <label>1. חפש או בחר שבת / מועד</label>
      <div class="row-flex" style="margin-bottom:12px;">
        <input list="datesList" id="dateInput" placeholder="הקלד או בחר שבת / מועד...">
        <datalist id="datesList"></datalist>
        <button class="btn-small" onclick="toggleNewDate()">+ שבת</button>
      </div>
      <div id="newDateBox" class="hidden" style="background:#edf2f7; padding:10px; border-radius:8px; margin-bottom:12px;">
        <input type="text" id="newDateTitle" placeholder="שם השבת (למשל: פרשת וישלח)">
        <button class="btn-primary" onclick="saveNewDate()">הוסף שבת לרשימה</button>
      </div>

      <label>2. חפש אדם (או הוסף חדש)</label>
      <div class="row-flex" style="margin-bottom:12px;">
        <input list="peopleList" id="personInput" placeholder="הקלד שם או כינוי...">
        <datalist id="peopleList"></datalist>
        <button class="btn-small" onclick="toggleNewPerson()">+ חדש</button>
      </div>
      <div id="newPersonBox" class="hidden" style="background:#edf2f7; padding:10px; border-radius:8px; margin-bottom:12px;">
        <input type="text" id="newPersonName" placeholder="שם וזיהוי (למשל: יוסי - אורח של דוד)">
        <input type="tel" id="newPersonPhone" placeholder="טלפון (אופציונלי)">
        <button class="btn-primary" onclick="saveNewPerson()">שמור אדם חדש</button>
      </div>

      <label>3. סכום בשקלים (₪)</label>
      <input type="number" id="amountInput" inputmode="numeric" placeholder="0">
      <div class="quick-amounts">
        <button type="button" onclick="setAmount(18)">18 ₪</button>
        <button type="button" onclick="setAmount(36)">36 ₪</button>
        <button type="button" onclick="setAmount(52)">52 ₪</button>
        <button type="button" onclick="setAmount(100)">100 ₪</button>
        <button type="button" onclick="setAmount(180)">180 ₪</button>
      </div>

      <label>תיאור / הערה (אופציונלי)</label>
      <input type="text" id="typeInput" placeholder="למשל: עלייה לתורה, קידוש...">
      <button class="btn-primary" id="saveBtn" onclick="submitCommitment()">שמור פתק והמשך לבא</button>
    </div>

    <div class="card">
      <div style="font-weight:bold; margin-bottom:8px;">פתקים שהוזנו בשבת הנבחרת:</div>
      <div id="shabbatEntriesList"></div>
    </div>
  </div>

  <div id="tab-people" class="hidden">
    <div class="card">
      <input type="text" id="searchDebtInput" oninput="renderPeopleSummary()" placeholder="חפש שם לבדיקת יתרה...">
      <div id="peopleSummaryList"></div>
    </div>
  </div>

  <div id="tab-dates" class="hidden">
    <div class="card">
      <input type="text" id="searchDatesInput" oninput="renderDatesSummary()" placeholder="חפש שבת או מועד...">
      <div style="font-weight:bold; margin-bottom:8px;">סיכום הכנסות לפי שבת / מועד</div>
      <div id="datesSummaryList"></div>
    </div>
  </div>
</div>

<nav class="nav">
  <button id="nav-entry" class="active" onclick="switchTab('entry')">הזנת פתקים</button>
  <button id="nav-people" onclick="switchTab('people')">חובות אנשים</button>
  <button id="nav-dates" onclick="switchTab('dates')">סיכום שבתות</button>
</nav>

<script>
  const API_URL = 'https://script.google.com/macros/s/AKfycbydc_MX8VLvK-JcpkwUlOMwhXukVsrOK4ibpsYt-n1H9YOXAYW3qw4emlc9a8S_hcjZCA/exec';
  const API_KEY = 'AVIEL';
  const CACHE_KEY = 'synagogue_app_cache_v1';

  let appData = { people: [], dates: [], commitments: [] };
  const expandedPeople = new Set();

  function saveCache(data) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ savedAt: Date.now(), data }));
    } catch (_) {}
  }

  function loadCache() {
    try {
      const raw = localStorage.getItem(CACHE_KEY);
      if (!raw) return null;
      return JSON.parse(raw);
    } catch (_) {
      return null;
    }
  }

  async function apiCall(action, payload = {}) {
    if (action === 'getData') {
      const url = `${API_URL}?action=getData&key=${encodeURIComponent(API_KEY)}`;
      const res = await fetch(url, { method: 'GET' });
      const json = await res.json();
      if (!json.ok) throw new Error(json.error || 'שגיאה בטעינת הנתונים');
      return json.data;
    }
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({ action, key: API_KEY, ...payload })
    });
    const json = await res.json();
    if (!json.ok) throw new Error(json.error || 'שגיאה בשמירת הנתונים');
    return json.data;
  }

  async function syncFromSheet(showFeedback = false) {
    try {
      const data = await apiCall('getData');
      saveCache(data);
      onDataLoaded(data, 'מסונכרן מול הגיליון');
      if (showFeedback) showToast('הנתונים סונכרנו מהגיליון!');
    } catch (err) {
      const cached = loadCache();
      if (cached && cached.data) {
        onDataLoaded(cached.data, 'מוצג עותק שמור במכשיר (אין חיבור תקין כרגע)');
        if (showFeedback) showToast('אין חיבור לשרת — מוצג עותק מקומי', true);
      } else {
        document.getElementById('loader').innerHTML = `<div style="color:#c53030;">שגיאה בטעינה: ${err.message}</div>`;
      }
    }
  }

  window.onload = async () => {
    const cached = loadCache();
    if (cached && cached.data) {
      onDataLoaded(cached.data, 'טוען עדכון אחרון מהגיליון...');
    }
    await syncFromSheet(false);
  };

  function onDataLoaded(data, statusText) {
    appData = data;
    document.getElementById('loader').classList.add('hidden');
    document.getElementById('app').classList.remove('hidden');
    if (statusText) {
      document.getElementById('syncStatus').textContent = statusText;
    }
    refreshUI();
  }

  function refreshUI() {
    const reversedDates = [...appData.dates].reverse();
    const datesDatalist = document.getElementById('datesList');
    const dateInput = document.getElementById('dateInput');

    datesDatalist.innerHTML = '';
    reversedDates.forEach(d => {
      const opt = document.createElement('option');
      opt.value = d.title;
      datesDatalist.appendChild(opt);
    });

    if (!dateInput.value && reversedDates.length > 0) {
      dateInput.value = reversedDates[0].title;
    }
    dateInput.oninput = renderShabbatEntries;
    dateInput.onchange = renderShabbatEntries;

    const datalist = document.getElementById('peopleList');
    datalist.innerHTML = '';
    appData.people.forEach(p => {
      const opt = document.createElement('option');
      opt.value = p.name;
      datalist.appendChild(opt);
    });

    renderShabbatEntries();
    renderPeopleSummary();
    renderDatesSummary();
  }

  function setAmount(val) { document.getElementById('amountInput').value = val; }
  function toggleNewPerson() { document.getElementById('newPersonBox').classList.toggle('hidden'); }
  function toggleNewDate() { document.getElementById('newDateBox').classList.toggle('hidden'); }

  async function saveNewPerson() {
    const name = document.getElementById('newPersonName').value.trim();
    const phone = document.getElementById('newPersonPhone').value.trim();
    if (!name) return showToast('נא להזין שם וזיהוי', true);
    try {
      const data = await apiCall('addPerson', { name, phone, notes: '' });
      saveCache(data);
      onDataLoaded(data, 'מסונכרן מול הגיליון');
      document.getElementById('personInput').value = name;
      document.getElementById('newPersonName').value = '';
      document.getElementById('newPersonPhone').value = '';
      document.getElementById('newPersonBox').classList.add('hidden');
      showToast('המתפלל נוסף!');
    } catch (err) {
      showToast(err.message, true);
    }
  }

  async function saveNewDate() {
    const title = document.getElementById('newDateTitle').value.trim();
    if (!title) return showToast('נא להזין שם שבת / מועד', true);
    try {
      const data = await apiCall('addDate', { title, dateStr: new Date().toISOString().slice(0, 10) });
      saveCache(data);
      onDataLoaded(data, 'מסונכרן מול הגיליון');
      document.getElementById('dateInput').value = title;
      document.getElementById('newDateTitle').value = '';
      document.getElementById('newDateBox').classList.add('hidden');
      showToast('השבת נוספה!');
    } catch (err) {
      showToast(err.message, true);
    }
  }

  async function submitCommitment() {
    const dateTitle = document.getElementById('dateInput').value.trim();
    const person = document.getElementById('personInput').value.trim();
    const amount = document.getElementById('amountInput').value;
    const type = document.getElementById('typeInput').value.trim();
    if (!dateTitle) return showToast('יש לבחור או להוסיף שבת', true);
    if (!person) return showToast('יש לבחור או להוסיף אדם', true);
    if (!amount || Number(amount) <= 0) return showToast('יש להזין סכום תקין', true);

    const btn = document.getElementById('saveBtn');
    btn.disabled = true;
    btn.textContent = 'שומר...';

    try {
      if (!appData.people.some(p => p.name === person)) {
        await apiCall('addPerson', { name: person, phone: '', notes: '' });
      }
      if (!appData.dates.some(d => d.title === dateTitle)) {
        await apiCall('addDate', { title: dateTitle, dateStr: new Date().toISOString().slice(0, 10) });
      }
      const data = await apiCall('addCommitment', { person, dateTitle, amount, type, notes: '' });
      saveCache(data);
      onDataLoaded(data, 'מסונכרן מול הגיליון');
      document.getElementById('amountInput').value = '';
      document.getElementById('typeInput').value = '';
      showToast('הפתק נשמר!');
    } catch (err) {
      showToast(err.message, true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'שמור פתק והמשך לבא';
    }
  }

  function renderShabbatEntries() {
    const selectedDate = document.getElementById('dateInput').value.trim();
    const container = document.getElementById('shabbatEntriesList');
    const items = appData.commitments.filter(c => c.dateTitle === selectedDate);
    if (!selectedDate) {
      container.innerHTML = '<div style="color:#718096; font-size:0.9rem;">בחר או הקלד שבת לצפייה בפתקים שהוזנו.</div>';
      return;
    }
    if (!items.length) {
      container.innerHTML = '<div style="color:#718096; font-size:0.9rem;">עדיין לא הוזנו פתקים לשבת זו.</div>';
      return;
    }
    const total = items.reduce((s, c) => s + c.amount, 0);
    container.innerHTML = items.map(c => `
      <div class="list-item">
        <div><strong>${c.person}</strong><div style="font-size:0.85rem; color:#718096;">${c.type || 'התחייבות'}</div></div>
        <div style="font-weight:bold;">₪${c.amount}</div>
      </div>
    `).join('') + `<div style="margin-top:10px; padding-top:10px; border-top:2px solid #cbd5e0; font-weight:bold; display:flex; justify-content:space-between;">
      <span>סה"כ לשבת זו:</span><span>₪${total}</span>
    </div>`;
  }

  function togglePersonCard(encodedName) {
    const personName = decodeURIComponent(encodedName);
    if (expandedPeople.has(personName)) {
      expandedPeople.delete(personName);
    } else {
      expandedPeople.add(personName);
    }
    renderPeopleSummary();
  }

  function renderPeopleSummary() {
    const query = document.getElementById('searchDebtInput').value.trim().toLowerCase();
    const container = document.getElementById('peopleSummaryList');
    const html = appData.people
      .filter(p => p.name.toLowerCase().includes(query))
      .map(p => {
        const openItems = appData.commitments.filter(c => c.person === p.name && c.remaining > 0);
        const debt = openItems.reduce((sum, c) => sum + c.remaining, 0);
        const isExpanded = expandedPeople.has(p.name);
        const safeName = encodeURIComponent(p.name);

        const detailsRows = openItems.map(item => `
          <div style="padding:7px 0; border-bottom:1px dashed #e2e8f0; display:flex; justify-content:space-between; align-items:center; gap:8px;">
            <div>
              <strong>${item.dateTitle}</strong> ${item.type ? '('+item.type+')' : ''}
            </div>
            <div style="white-space:nowrap;">
              נותר: <strong>₪${item.remaining}</strong> <span style="color:#718096;">/ ₪${item.amount}</span>
            </div>
          </div>
        `).join('');

        const actionsHtml = debt > 0 ? `
          <div class="person-actions" onclick="event.stopPropagation()">
            <button class="btn-partial" onclick="partialPayPerson('${safeName}', ${debt})">תשלום חלקי</button>
            <button class="btn-pay" onclick="payAllPerson('${safeName}')">שלם הכל (₪${debt})</button>
          </div>
        ` : '';

        const detailsHtml = isExpanded ? `
          <div class="person-details">
            ${detailsRows || '<div style="color:#718096;">אין חיובים פתוחים לשבתות.</div>'}
          </div>
        ` : '';

        return `
          <div class="person-card">
            <div class="person-header" onclick="togglePersonCard('${safeName}')">
              <div>
                <div style="font-size:1rem;"><strong>${p.name}</strong></div>
                <div class="expand-hint">${openItems.length} פריטים פתוחים · לחץ ל${isExpanded ? 'הסתרת' : 'הצגת'} פירוט שבתות</div>
              </div>
              <span class="${debt > 0 ? 'badge-debt' : 'badge-ok'}">${debt > 0 ? 'לתשלום: ₪' + debt : 'אין חוב'}</span>
            </div>
            ${actionsHtml}
            ${detailsHtml}
          </div>
        `;
      }).join('');
    container.innerHTML = html || '<div style="color:#718096;">לא נמצאו תוצאות.</div>';
  }

  async function partialPayPerson(encodedName, totalDebt) {
    const personName = decodeURIComponent(encodedName);
    const val = prompt(`תשלום חלקי עבור ${personName} (סה"כ חוב: ₪${totalDebt}):`);
    if (!val) return;
    let remainingToApply = Number(val);
    if (isNaN(remainingToApply) || remainingToApply <= 0) return showToast('יש להזין סכום תקין', true);

    const openItems = appData.commitments.filter(c => c.person === personName && c.remaining > 0);
    if (!openItems.length) return showToast('אין חוב פתוח לרישום', true);

    try {
      let latestData = appData;
      for (const item of openItems) {
        if (remainingToApply <= 0) break;
        const payNow = Math.min(item.remaining, remainingToApply);
        latestData = await apiCall('recordPayment', { rowIndex: item.rowIndex, paymentAmount: payNow });
        remainingToApply -= payNow;
      }
      saveCache(latestData);
      onDataLoaded(latestData, 'מסונכרן מול הגיליון');
      showToast('התשלום החלקי נרשם!');
    } catch (err) {
      showToast(err.message, true);
    }
  }

  async function payAllPerson(encodedName) {
    const personName = decodeURIComponent(encodedName);
    const openItems = appData.commitments.filter(c => c.person === personName && c.remaining > 0);
    if (!openItems.length) return showToast('אין חוב פתוח לרישום', true);

    try {
      let latestData = appData;
      for (const item of openItems) {
        latestData = await apiCall('markAsPaid', { rowIndex: item.rowIndex });
      }
      saveCache(latestData);
      onDataLoaded(latestData, 'מסונכרן מול הגיליון');
      showToast(`כל החוב של ${personName} סומן כשולם!`);
    } catch (err) {
      showToast(err.message, true);
    }
  }

  function renderDatesSummary() {
    const query = (document.getElementById('searchDatesInput')?.value || '').trim().toLowerCase();
    const container = document.getElementById('datesSummaryList');
    const filteredDates = [...appData.dates]
      .reverse()
      .filter(d => d.title.toLowerCase().includes(query));

    container.innerHTML = filteredDates.map(d => {
      const items = appData.commitments.filter(c => c.dateTitle === d.title);
      const total = items.reduce((s, c) => s + c.amount, 0);
      const paid = items.reduce((s, c) => s + c.paidAmount, 0);
      return `<div class="list-item">
        <div>
          <strong>${d.title}</strong>
          <div style="font-size:0.85rem; color:#718096;">שולם בפועל: ₪${paid} מתוך ₪${total}</div>
        </div>
        <div style="font-weight:bold; font-size:1.05rem;">₪${total}</div>
      </div>`;
    }).join('') || '<div style="color:#718096;">לא נמצאו שבתות תואמות.</div>';
  }

  function switchTab(tab) {
    ['entry', 'people', 'dates'].forEach(t => {
      document.getElementById('tab-' + t).classList.toggle('hidden', t !== tab);
      document.getElementById('nav-' + t).classList.toggle('active', t === tab);
    });
  }

  function showToast(msg, isError) {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.style.background = isError ? '#c53030' : '#2f855a';
    el.classList.remove('hidden');
    setTimeout(() => el.classList.add('hidden'), 3000);
  }
</script>
</body>
</html>

name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses & install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true

      - name: Create minimal Android WebView project
        env:
          ICON_FILE: icon.jpg
        run: |
          mkdir -p app/src/main/java/com/shul/tracker
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-mdpi
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xhdpi
          mkdir -p app/src/main/res/mipmap-xxhdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi

          cp index.html app/src/main/assets/index.html

          CHOSEN_ICON=""
          if [ -n "$ICON_FILE" ] && [ -f "$ICON_FILE" ]; then
            CHOSEN_ICON="$ICON_FILE"
          elif [ -f "icon.jpg" ]; then
            CHOSEN_ICON="icon.jpg"
          elif [ -f "icon.jpeg" ]; then
            CHOSEN_ICON="icon.jpeg"
          elif [ -f "icon.png" ]; then
            CHOSEN_ICON="icon.png"
          fi

          python3 -m pip install --break-system-packages -q Pillow || true

          CHOSEN_ICON="$CHOSEN_ICON" python3 - << 'EOF'
          import os, shutil, struct, zlib

          icon_path = os.environ.get("CHOSEN_ICON", "")
          sizes = {
              "mipmap-mdpi": 48,
              "mipmap-hdpi": 72,
              "mipmap-xhdpi": 96,
              "mipmap-xxhdpi": 144,
              "mipmap-xxxhdpi": 192,
          }

          def write_solid_png(path, size, rgba=(26, 54, 93, 255)):
              def chunk(tag, data):
                  return struct.pack("!I", len(data)) + tag + data + struct.pack("!I", zlib.crc32(tag + data) & 0xffffffff)
              raw = b"".join(b"\x00" + bytes(rgba) * size for _ in range(size))
              ihdr = struct.pack("!IIBBBBB", size, size, 8, 6, 0, 0, 0)
              png = b"\x89PNG\r\n\x1a\n" + chunk(b"IHDR", ihdr) + chunk(b"IDAT", zlib.compress(raw)) + chunk(b"IEND", b"")
              with open(path, "wb") as f:
                  f.write(png)

          try:
              from PIL import Image
              if icon_path and os.path.exists(icon_path):
                  img = Image.open(icon_path).convert("RGBA")
              else:
                  img = Image.new("RGBA", (512, 512), (26, 54, 93, 255))

              for folder, px in sizes.items():
                  resized = img.resize((px, px), Image.Resampling.LANCZOS)
                  resized.save(f"app/src/main/res/{folder}/ic_launcher.png")
                  resized.save(f"app/src/main/res/{folder}/ic_launcher_round.png")
          except Exception as e:
              print("Fallback icon generator used:", e)
              for folder, px in sizes.items():
                  p1 = f"app/src/main/res/{folder}/ic_launcher.png"
                  p2 = f"app/src/main/res/{folder}/ic_launcher_round.png"
                  if icon_path and os.path.exists(icon_path) and icon_path.lower().endswith(".png"):
                      shutil.copyfile(icon_path, p1)
                      shutil.copyfile(icon_path, p2)
                  else:
                      write_solid_png(p1, px)
                      write_solid_png(p2, px)
          EOF

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          kotlin.stdlib.jdk.variants=false
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ShulTracker"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.11.1' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.shul.tracker"
              compileSdk 35

              defaultConfig {
                  applicationId "com.shul.tracker"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">מעקב בית כנסת</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/shul/tracker/MainActivity.java
          package com.shul.tracker;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      webView = new WebView(this);
                      setContentView(webView);

                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                      webView.setWebViewClient(new WebViewClient());
                      webView.setWebChromeClient(new WebChromeClient());
                      webView.loadUrl("file:///android_asset/index.html");
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Download Gradle 8.14.3 and Build Debug APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.14.3/bin/gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shul-tracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk

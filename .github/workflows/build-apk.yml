name: Build Android APK

on:
  workflow_dispatch: 
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK licenses & install SDK components
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true

      - name: Create minimal Android WebView project
        run: |
          mkdir -p app/src/main/java/com/shul/tracker
          mkdir -p app/src/main/res/values
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-mdpi \
                   app/src/main/res/mipmap-hdpi \
                   app/src/main/res/mipmap-xhdpi \
                   app/src/main/res/mipmap-xxhdpi \
                   app/src/main/res/mipmap-xxxhdpi

          cp index.html app/src/main/assets/index.html

          ICON_FILE=""
          if [ -f "icon.jpg" ]; then
            ICON_FILE="icon.jpg"
          elif [ -f "icon.png" ]; then
            ICON_FILE="icon.png"
          fi

          if [ -n "$ICON_FILE" ]; then
            python3 - << EOF
try:
    from PIL import Image
except ImportError:
    import subprocess, sys
    subprocess.check_call([sys.executable, "-m", "pip", "install", "-q", "Pillow"])
    from PIL import Image

img = Image.open("$ICON_FILE").convert("RGBA")
sizes = {
    "mipmap-mdpi": 48,
    "mipmap-hdpi": 72,
    "mipmap-xhdpi": 96,
    "mipmap-xxhdpi": 144,
    "mipmap-xxxhdpi": 192,
}
for folder, px in sizes.items():
    resized = img.resize((px, px), Image.Resampling.LANCZOS)
    resized.save(f"app/src/main/res/{folder}/ic_launcher.png")
    resized.save(f"app/src/main/res/{folder}/ic_launcher_round.png")
EOF
          fi

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          kotlin.stdlib.jdk.variants=false
          EOF

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ShulTracker"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.11.1' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
          }

          android {
              namespace "com.shul.tracker"
              compileSdk 35

              defaultConfig {
                  applicationId "com.shul.tracker"
                  minSdk 23
                  targetSdk 35
                  versionCode 1
                  versionName "1.0"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }

          configurations.all {
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
              exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
          }
          EOF

          cat << 'EOF' > app/src/main/res/values/strings.xml
          <resources>
              <string name="app_name">מעקב בית כנסת</string>
          </resources>
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET" />
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher_round"
                  android:theme="@android:style/Theme.DeviceDefault.Light.NoActionBar"
                  android:usesCleartextTraffic="true">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.category.LAUNCHER" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/shul/tracker/MainActivity.java
          package com.shul.tracker;

          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;

          public class MainActivity extends Activity {
              private WebView webView;

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  try {
                      webView = new WebView(this);
                      setContentView(webView);

                      WebSettings settings = webView.getSettings();
                      settings.setJavaScriptEnabled(true);
                      settings.setDomStorageEnabled(true);
                      settings.setDatabaseEnabled(true);
                      settings.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);

                      webView.setWebViewClient(new WebViewClient());
                      webView.setWebChromeClient(new WebChromeClient());
                      webView.loadUrl("file:///android_asset/index.html");
                  } catch (Exception e) {
                      e.printStackTrace();
                  }
              }

              @Override
              public void onBackPressed() {
                  if (webView != null && webView.canGoBack()) {
                      webView.goBack();
                  } else {
                      super.onBackPressed();
                  }
              }
          }
          EOF

      - name: Download Gradle 8.14.3 and Build Debug APK
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.14.3-bin.zip -o gradle.zip
          unzip -q gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/gradle-8.14.3/bin/gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: shul-tracker-apk
          path: app/build/outputs/apk/debug/app-debug.apk
